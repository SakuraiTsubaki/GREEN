name: GREEN remake core checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GREEN
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python tooling
        run: python -m compileall -q tools tests

      - name: Validate expansion policy
        run: python tools/validate_expansion_policy.py

      - name: Verify committed baseline metadata
        run: python tools/verify_green_baselines.py

      - name: Run GREEN unit tests
        run: python -m unittest discover -s tests -v

      - name: Checkout pinned modern core
        uses: actions/checkout@v4
        with:
          repository: rh-hideout/pokeemerald-expansion
          ref: 75b806a3ab57a81ff1eb6179288981f0b3cc3050
          path: _engine

      - name: Verify GREEN patches against pin
        run: python tools/prepare_green_engine.py --engine-dir _engine --check-only
