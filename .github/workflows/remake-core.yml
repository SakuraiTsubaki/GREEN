name: GREEN original ROM expansion checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GREEN
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile tooling
        run: python -m compileall -q src tools tests

      - name: Validate original-ROM expansion policy
        run: python tools/validate_expansion_policy.py

      - name: Verify committed Green baseline metadata
        run: python tools/verify_green_baselines.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
